name: 宇宙ニュース毎朝要約

# 毎朝9時(JST) = 00:00 UTC に実行。手動実行も可能。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: space-news-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ニュースを収集して要約を生成
        env:
          # ANTHROPIC_API_KEY を Secrets に登録すると Claude による論説要約が有効になります。
          # 未登録でも自動生成の要約で動作します。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-4-8
        run: python space-news/crawler.py

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add space-news/digests space-news/index.html
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "宇宙ニュース要約を更新: $(date -u +%Y-%m-%d)"
            git push
          fi
